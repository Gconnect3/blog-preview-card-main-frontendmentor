<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <main class="page">
    <article class="card">
      <div class="card__media">
        <img class="card__image" src="assets/images/illustration-article.svg" alt="illustration design">
      </div>
      <section class="card__content">
        <span class="card__content--taxonomy">Learning</span>
        <p class="card__content--published">Published 21 Dec 2023</p>
        <a href="#" target="_blank">
          <h2 class="card__content--title">HTML & CSS foundations</h2>
        </a>
        <p class="card__content--excerpt">These languages are the backbone of every website, defining structure,
          content, and
          presentation.
        </p>
      </section>

      <div class="card__author">
        <img class="card__author--avatar" src="assets/images/image-avatar.webp"></img>
        <p class="card__author">
          Greg Hooper
        </p>
      </div>

    </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>

</html>
